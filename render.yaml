# Render Blueprint — DRUVO UK website
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: druvo-uk
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SITE_NAME
        value: DRUVO UK
      - key: CONTACT_EMAIL
        value: druvo.uk@gmail.com
      - key: CATALOG_SOURCE
        value: mock
      - key: SITE_URL
        value: "https://druvo-uk-website.onrender.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: DRUVO_API_BASE_URL
        value: ""
      - key: DRUVO_API_KEY
        sync: false
      - key: DRUVO_API_TIMEOUT_SECONDS
        value: "30"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_DB_PATH
        value: "/tmp/druvo_checkout.db"
      - key: SHIPPING_STANDARD_GBP
        value: "3.99"
      - key: SHIPPING_FREE_THRESHOLD_GBP
        value: "75"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_CHECKLIST_TOKEN
        sync: false
      - key: PRODUCTION_MODE
        value: "false"
