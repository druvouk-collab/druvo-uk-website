<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ site_name }}</title></head>
<body style="margin:0;background:#f4f4f2;font-family:Arial,Helvetica,sans-serif;color:#111;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:8px;">
<tr><td style="background:#111;color:#fff;padding:20px 24px;font-size:20px;font-weight:bold;letter-spacing:2px;">{{ site_name }}</td></tr>
<tr><td style="padding:24px;font-size:15px;line-height:1.5;">{% block body %}{% endblock %}</td></tr>
<tr><td style="padding:16px 24px;border-top:1px solid #eee;font-size:12px;color:#666;">
<a href="{{ site_url }}" style="color:#666;">{{ site_url }}</a> · <a href="mailto:{{ contact_email }}" style="color:#666;">{{ contact_email }}</a>
{% if business_legal_name %}<br>{{ business_legal_name }}{% if company_number %} · Company no. {{ company_number }}{% endif %}{% if business_address %} · {{ business_address }}{% endif %}{% endif %}
</td></tr></table></td></tr></table></body></html>
