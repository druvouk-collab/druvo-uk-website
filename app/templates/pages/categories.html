{% extends "base.html" %}
{% block meta_description %}Browse DRUVO UK categories — shop premium pre-loved and new resale clothing, footwear and accessories by category.{% endblock %}
{% block content %}
<div class="container page-header"><h1>Categories</h1></div>
<section class="container section">
  <div class="category-grid">
    {% for category in categories %}
      <a class="category-card" href="/categories/{{ category.slug }}">
        <img class="druvo-img" src="{{ category.image }}" alt="{{ category.name }}" loading="lazy" data-placeholder="{{ placeholder_category }}">
        <span>{{ category.name }}</span>
      </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
