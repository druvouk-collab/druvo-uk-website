{% extends "base.html" %}
{% block content %}
<div class="container page-header"><h1>Find your orders</h1></div>
<article class="container content-card" style="max-width:480px;margin-bottom:3rem;">
  <p class="product-meta">Customer password sign-in is coming soon. For now, enter the email address you used at checkout to view your order history from DRUVO AI.</p>
  <form class="form-grid" method="get" action="/account/orders">
    <div class="form-field">
      <label for="email">Checkout email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" value="{{ lookup_email }}" required>
    </div>
    <button class="btn btn-primary" type="submit">View order history</button>
  </form>
</article>
{% endblock %}
