<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title }} · {{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}DRUVO UK — premium pre-loved and new resale fashion, footwear, and accessories.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/druvo.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="sr-only" href="#main-content">Skip to content</a>
  {% include "components/header.html" %}
  {% if catalog_degraded and catalog_notice %}
  <div class="container notice catalog-notice" role="status">{{ catalog_notice }}</div>
  {% endif %}
  <main id="main-content">{% block content %}{% endblock %}</main>
  {% include "components/footer.html" %}
  <script type="module" src="/static/js/cart.js"></script>
  <script type="module" src="/static/js/images.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
