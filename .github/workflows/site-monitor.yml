# Keeps druvo.uk awake and checks it from outside, using free GitHub Actions minutes.
#
# Why: the site runs on Render's free plan, which puts the server to sleep after 15 minutes without
# visitors. The next visitor then waits up to a minute and can see a 503 error. A light request every
# 10 minutes keeps it awake (one service running all month uses ~744 of the 750 free hours — so don't
# keep a second free Render service awake at the same time).
#
# Every hour it also runs the full check (all sitemap pages, images, robots.txt, Merchant feed,
# product structured data). If anything fails, the run fails and GitHub emails the repo owner.
# Note: GitHub treats schedules as best effort. On 26–27 Nov 2026 it ran this every-10-minute schedule
# only 9 times in 36 hours, so it can't keep a Render Free service awake. The reliable fix is an
# always-on instance (Render Starter). This workflow stays as the outside health check.
name: Site monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # keep-alive + (first run of each hour) full check
  workflow_dispatch: {}
  push:
    branches: [main, "ops/**"]
    paths: [".github/workflows/site-monitor.yml", "scripts/site_check.py"]

permissions:
  contents: read

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.when.outputs.full }}
    steps:
      - name: Decide whether to run the full check
        id: when
        # GitHub skips many scheduled runs, so don't depend on one exact schedule firing: any scheduled run
        # in the first 15 minutes of the hour (and every manual or push run) does the full check.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%-M)" -lt 15 ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wake the site
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 -A 'DRUVO-keepalive' https://druvo.uk/health || true)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::druvo.uk/health did not return 200 after 4 attempts"
          exit 1

  full-check:
    needs: monitor
    if: needs.monitor.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Full site check
        run: python3 scripts/site_check.py https://druvo.uk
