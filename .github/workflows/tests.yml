# Runs the full test suite on real PostgreSQL 16 (the production database), including the
# concurrency tests that prove two customers can't buy the last item at the same time.
# Free GitHub Actions minutes. Runs on every push to develop/ops branches and on pull requests.
name: Tests

on:
  push:
    branches: ["develop/**", "ops/**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: druvo
          POSTGRES_PASSWORD: druvo
          POSTGRES_DB: druvo_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://druvo:druvo@localhost:5432/druvo_test
        run: python -m pytest -q
